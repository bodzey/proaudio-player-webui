name: WebUI CI

on:
  push:
    branches:
      - main
      - dev
      - newui
      - feature/universal-audio-backend
  pull_request:

permissions:
  contents: read

jobs:
  webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Build
        run: npm run build
