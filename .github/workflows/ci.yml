name: WebUI CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: |
          npm run format
          echo '__ALERTS_PANEL_BEGIN__'
          base64 -w0 src/features/alerts/AlertsPanel.tsx
          echo
          echo '__ALERTS_PANEL_END__'
          exit 1

      - name: Build
        run: npm run build
